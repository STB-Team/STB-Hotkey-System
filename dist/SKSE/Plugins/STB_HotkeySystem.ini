[Assignment]

; DX scancode of the modifier held to assign a hotkey in a menu (29 = Left Ctrl)
; Must NOT be the same key that opens the Favorites menu (the game warns you on load).
iModifierScanCode = 29

; Allow 2-key chord binds.
; 1 -> a single key commits when you RELEASE the modifier (so you can still add a 2nd
;      key); pressing a 2nd key commits the chord instantly.
; 0 -> single-key only: the first key press commits instantly (modifier + key = bind),
;      no need to release.
bEnableChords = 0


[Icons]

; Keycap rendering. Edit + REOPEN the menu to see changes (no restart).
; Native keycap is 26px at fScale=100. Shared by all menus:
fScale = 75.0
fY = 2.0

; bAfterName=1 -> keycap follows the item-name width (fX = gap after the name).
; bAfterName=0 -> fX is an absolute X inside the row.
bAfterName = 1
; --- inventory / container / barter / gift ---
fX = 5.0
fGap = 20.0


[IconsMagic]

; Magic menu (separate X/Gap; defaults to [Icons] if omitted).
fX = 5.0
fGap = 20.0


[IconsFavorites]

; Favorites menu (separate X/Gap; defaults to [Icons] if omitted).
fX = 10.0
fGap = 20.0


[Gameplay]

; A hotkey bound to a shout/power equips AND instantly casts it on one press.
bCastVoiceOnEquip = 1


[Compatibility]

; On loading a save, convert any pre-existing vanilla favorites hotkeys (item hotkey
; slots + magic hotkeys) into this system's binds on number keys 1-8, then clear the
; vanilla slot. Keeps old saves working. 1 = migrate, 0 = leave vanilla hotkeys alone.
bMigrateVanillaHotkeys = 1


[Debug]

; Verbose diagnostics in SKSE/STB_HotkeySystem.log: every pickup, per-instance stamping,
; "nothing held" notes, each hotkey press. Only turn on to chase a bug -- it writes a lot.
; Assignments, binding removals and warnings are logged either way.
bDebugLog = 0
