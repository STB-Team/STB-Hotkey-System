[Assignment]

; DX scancode of the modifier held to assign a hotkey in a menu (29 = Left Ctrl)
; Must NOT be the same key that opens the Favorites menu (the game warns you on load).
iModifierScanCode = 29

; DX scancode of the second modifier: held instead of the one above, a keypress ADDS the
; selected item to whatever that key already holds, so one key equips the whole set at
; once (a sword, a shield and a potion on the same key). Pressing it again on a member
; takes that member back out. The plain modifier above still means "this key = just this
; one item" and wipes a group off the key.
; Hand items are handed out in the order you added them: first weapon/spell to the right
; hand, second to the left; shields and torches always go left.
; Must not be the same key as the modifier above or as the Favorites-menu key -- if it is,
; groups are switched off and the log says so. 0 disables groups. 42 = Left Shift.
iGroupModifierScanCode = 42

; While a modifier is held in the inventory/magic/favorites menu, stop the keys you press
; from ALSO doing their usual job in that menu -- so binding Ctrl+E doesn't equip the item
; as well, Ctrl+R doesn't drop it and Ctrl+F doesn't un-favorite it. The key that closes
; the menu is never held back, so the menu can always be left.
; 1 = keys only assign while a modifier is down, 0 = the menu reacts as usual.
bBlockMenuKeys = 1

; Show "Assign hotkey" (and "Add to group") among the button hints along the bottom of the
; inventory and magic menus, next to Use / Drop / Unfavorite. Needs a SkyUI-shaped menu; on
; a crowded row the hints are the first thing to be left out, which is intended.
; 1 = show, 0 = hide.
bShowAssignHint = 1

; Allow 2-key chord binds.
; 1 -> a single key commits when you RELEASE the modifier (so you can still add a 2nd
;      key); pressing a 2nd key commits the chord instantly.
; 0 -> single-key only: the first key press commits instantly (modifier + key = bind),
;      no need to release.
bEnableChords = 0

; Warn before binding a key that already drives a vanilla gameplay control (Activate,
; Ready Weapon, ...), the way SkyUI's MCM does -- you get a confirm prompt instead of
; silently ending up with two actions on one press. The vanilla favourites slots on the
; number row are never counted: replacing those is what this mod is for.
; 1 = ask, 0 = assign silently.
bWarnKeyConflict = 1


[Icons]

; Keycap rendering. Edit + REOPEN the menu to see changes (no restart).
; Native keycap is 26px at fScale=100. Shared by all menus:
fScale = 75.0
fY = 2.0

; bAfterName=1 -> keycap follows the item-name width (fX = gap after the name).
; bAfterName=0 -> fX is an absolute X inside the row.
bAfterName = 1
; --- inventory / container / barter / gift ---
fX = 5.0
fGap = 20.0


[IconsMagic]

; Magic menu (separate X/Gap; defaults to [Icons] if omitted).
fX = 5.0
fGap = 20.0


[IconsFavorites]

; Favorites menu (separate X/Gap; defaults to [Icons] if omitted).
fX = 10.0
fGap = 20.0


[Gameplay]

; A hotkey bound to a shout/power equips AND instantly casts it on one press.
bCastVoiceOnEquip = 1


[Debug]

; Verbose diagnostics in SKSE/STB_HotkeySystem.log: every pickup, per-instance stamping,
; "nothing held" notes, each hotkey press. Only turn on to chase a bug -- it writes a lot.
; Assignments, binding removals and warnings are logged either way.
bDebugLog = 0
